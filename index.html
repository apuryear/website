<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Augustine Puryear</title>
    <link rel="icon" type="image/png" href="image.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 100%; scroll-behavior: smooth; }
        body { min-height: 100vh; background-color: #764ba2; display: flex; align-items: center; justify-content: center; padding: 1.25rem; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; position: relative; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%), radial-gradient(circle at 40% 80%, rgba(120, 219, 255, 0.3) 0%, transparent 50%), url('background.jpg'); background-position: center center; background-repeat: no-repeat; background-size: auto, auto, auto, cover; pointer-events: none; z-index: 0; }
        body::after { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('foreground.png'); background-size: cover; background-position: center center; background-repeat: no-repeat; z-index: 2; pointer-events: none; }
        .container { max-width: 450px; width: 100%; text-align: center; position: relative; z-index: 1; }
        .glass { position: relative; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px) saturate(150%); -webkit-backdrop-filter: blur(5px) saturate(150%); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 1.5rem; padding: 2rem; box-shadow: 0 8px 32px rgba(31, 38, 135, 0.2), inset 0 2px 10px rgba(255, 255, 255, 0.2); }
        .profile-pic { width: 120px; height: 120px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.5); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); object-fit: cover; margin-bottom: 1rem; }
        .profile-name { font-size: 2rem; font-weight: 700; color: white; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2); margin-bottom: 1rem; }
        .location {font-size: 1rem; font-weight: 500; color: white; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2); margin-bottom: 1rem; }
        .links-container { display: flex; flex-direction: column; gap: 1rem; }
        .link-btn { position: relative; display: flex; align-items: center; justify-content: center; gap: 0.75rem; color: white; padding: 0.9rem 1.5rem; border-radius: 0.75rem; cursor: pointer; transition: all 0.3s ease; text-decoration: none; font-size: 1rem; font-weight: 500; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(2px) saturate(180%); -webkit-backdrop-filter: blur(2px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); }
        .link-btn:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15); }
        .link-btn i { font-size: 1.2rem; width: 20px; text-align: center; }
        #ai-fab-container { position: fixed; bottom: 2rem; right: 2rem; z-index: 3; }
        #ask-ai-btn { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; width: 60px; height: 60px; border-radius: 50%; font-size: 1.75rem; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 25px rgba(0,0,0,0.25); transition: all 0.3s ease; }
        #ask-ai-btn:hover { transform: scale(1.1) rotate(15deg); box-shadow: 0 12px 35px rgba(0,0,0,0.3); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.visible { opacity: 1; pointer-events: auto; }
        .modal-content { color: white; padding: 1.5rem 2rem; max-width: 500px; width: 90%; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .modal-title { font-size: 1.5rem; font-weight: 600; }
        .close-modal { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; opacity: 0.7; transition: opacity 0.2s; }
        .close-modal:hover { opacity: 1; }
        #ai-query-form { display: flex; flex-direction: column; gap: 1rem; }
        #question-input { width: 100%; min-height: 80px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 0.75rem; padding: 0.75rem; color: white; font-family: 'Inter', sans-serif; font-size: 1rem; resize: vertical; }
        #question-input::placeholder { color: rgba(255, 255, 255, 0.6); }
        #submit-question-btn { align-self: flex-end; }
        #gemini-output { line-height: 1.6; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, 0.2); min-height: 50px; text-align: left; }
        @media (max-width: 480px) { .glass { padding: 1.5rem; } .profile-name { font-size: 1.75rem; } .profile-pic { width: 100px; height: 100px; } #ai-fab-container { bottom: 1rem; right: 1rem; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="glass">
            <img
              src="https://avatars.githubusercontent.com/u/165216125"
              alt="Profile Picture of Augustine Puryear"
              class="profile-pic"
              onerror="this.onerror=null;this.src='https://placehold.co/120x120/764ba2/ffffff?text=AP';"
            />
            <h1 class="profile-name">𝙰𝚞𝚐𝚞𝚜𝚝𝚒𝚗𝚎 𝙿𝚞𝚛𝚢𝚎𝚊𝚛</h1>
            <h2 class="location"><img src="connecticut.png" alt="State of Connecticut" style="height: 2.5em; margin-right: 8px; vertical-align: middle;">Connecticut, USA</h2>
            <div class="links-container">
                <a href="https://github.com/apuryear" target="_blank" class="link-btn"><i class="fa-brands fa-github"></i><span>GitHub</span></a>
                <a href="https://bsky.app/profile/augustine.puryear.me" target="_blank" class="link-btn"><img src="bluesky.png" alt="Bluesky" style="height: 1.75em; margin-right: 2px; vertical-align: middle;"></i><span>Bluesky</span></a>
                <a href="https://x.com/am_puryear" target="_blank" class="link-btn"><i class="fa-brands fa-x-twitter"></i><span>X</span></a>
                <a href="https://threads.com/@augustine.puryear" target="_blank" class="link-btn"><i class="fa-brands fa-threads"></i><span>Threads</span></a>
            </div>
        </div>
    </div>

    <div id="ai-fab-container">
        <button id="ask-ai-btn" title="Ask AI about me">✨</button>
    </div>

    <div id="gemini-modal" class="modal-overlay">
        <div class="glass modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Ask about me</h2>
                <button id="close-modal-btn" class="close-modal">&times;</button>
            </div>
            <form id="ai-query-form">
                <textarea id="question-input" placeholder="What would you like to know?"></textarea>
                <button type="submit" id="submit-question-btn" class="link-btn">
                    Get Answer
                </button>
            </form>
            <div id="gemini-output"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const askAiBtn = document.getElementById('ask-ai-btn');
        const modal = document.getElementById('gemini-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const queryForm = document.getElementById('ai-query-form');
        const questionInput = document.getElementById('question-input');
        const geminiOutput = document.getElementById('gemini-output');
        const submitBtn = document.getElementById('submit-question-btn');

        askAiBtn.addEventListener('click', () => modal.classList.add('visible'));
        closeModalBtn.addEventListener('click', () => modal.classList.remove('visible'));
        modal.addEventListener('click', (e) => e.target === modal && modal.classList.remove('visible'));
        queryForm.addEventListener('submit', handleAiQuery);
      
        const availableTools = {
            performWebSearch: async function(query) {
                geminiOutput.innerHTML = `Searching for: "${query}"... <i class="fa-solid fa-magnifying-glass fa-fade"></i>`;
                try {
                    const response = await fetch('https://api.tavily.com/search', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            api_key: TAVILY_API_KEY,
                            query: query,
                            search_depth: "basic",
                            max_results: 5
                        }),
                    });
                    if (!response.ok) throw new Error('Tavily API search failed');
                    const data = await response.json();
                    if (data.results && data.results.length > 0) {
                        return JSON.stringify(data.results.map(res => ({ url: res.url, content: res.content })));
                    }
                    return "No relevant information was found on the web.";
                } catch (error) {
                    console.error("Web search failed:", error);
                    return "Could not perform a web search at this time.";
                }
            }
        };

async function handleAiQuery(event) {
            event.preventDefault();
            const userQuestion = questionInput.value.trim();
            if (!userQuestion) {
                geminiOutput.innerHTML = 'Please enter a question.';
                return;
            }

            if (typeof OPENROUTER_API_KEY === 'undefined' || OPENROUTER_API_KEY.includes("PASTE_YOUR")) {
                geminiOutput.innerText = "OpenRouter API key is not configured in config.js."; return;
            }
            if (typeof TAVILY_API_KEY === 'undefined' || TAVILY_API_KEY.includes("PASTE_YOUR")) {
                geminiOutput.innerText = "Tavily API key is not configured in config.js."; return;
            }

            submitBtn.disabled = true;
            geminiOutput.innerHTML = 'Thinking... <i class="fa-solid fa-spinner fa-spin"></i>';

            const systemPrompt = `You are a helpful AI assistant for Augustine Puryear's personal website. Your job is to answer questions about him. You have access to a web search tool. Base Context about Augustine Puryear: Name: Augustine Puryear, GitHub: apuryear, X (Twitter): am_puryear, Bluesky: augustine.puryear.me, Threads: augustine.puryear. Instructions: 1. First, decide if the user's question can be answered from the base context. 2. If not, or if the question requires current, specific, or quantitative information (like follower counts), you MUST use the 'performWebSearch' tool. 3. Construct a precise search query for the tool. 4. After receiving the search results, synthesize them with the base context to provide a final, comprehensive answer. 5. Always answer in the first person, as if you are an assistant speaking on his behalf.`;
            const tools = [{ type: "function", function: { name: "performWebSearch", description: "Searches the web for up-to-date information about Augustine Puryear.", parameters: { type: "object", properties: { query: { type: "string", description: "A specific and detailed search query string." } }, required: ["query"] } } }];
            let messages = [{ role: "system", content: systemPrompt }, { role: "user", content: userQuestion }];

            try {
                let response = await callOpenRouter(messages, tools);
                let message = response.choices[0].message;

                console.log("Initial model response:", JSON.stringify(message, null, 2));

                if (message.tool_calls && message.tool_calls.length > 0) {
                    console.log("Tool call detected. Executing function...");
                    messages.push(message);
                    
                    // --- NEW: Robust Parsing and Error Handling ---
                    for (const toolCall of message.tool_calls) {
                        try {
                            const functionName = toolCall.function.name;
                            let argumentsString = toolCall.function.arguments;

                            console.log("Raw arguments string from model:", argumentsString);

                            
                            if (argumentsString.startsWith("```json")) {
                                argumentsString = argumentsString.substring(7, argumentsString.length - 3).trim();
                            }
                            
                            const functionArgs = JSON.parse(argumentsString);
                            const toolResponse = await availableTools[functionName](functionArgs.query);
                            
                            messages.push({ tool_call_id: toolCall.id, role: "tool", name: functionName, content: toolResponse });

                        } catch (e) {
                            console.error("Failed to parse tool arguments or execute tool:", e);
                            
                            messages.push({
                                tool_call_id: toolCall.id,
                                role: "tool",
                                name: toolCall.function.name,
                                content: `Error: Could not execute tool. Invalid arguments provided: ${toolCall.function.arguments}`,
                            });
                        }
                    }
                    
                    
                    geminiOutput.innerHTML = 'Synthesizing answer... <i class="fa-solid fa-spinner fa-spin"></i>';
                    response = await callOpenRouter(messages);
                    message = response.choices[0].message;
                }

                geminiOutput.innerText = message.content || "The model did not provide a text response.";

            } catch (error) {
                console.error("AI query process failed:", error);
                geminiOutput.innerText = `Sorry, an error occurred. Please check the console for details.`;
            } finally {
                submitBtn.disabled = false;
            }
        }
       

        async function callOpenRouter(messages, tools = null) {
            const body = {
                model: "gemini-2.0-flash",
                messages: messages,
            };
            if (tools) {
                body.tools = tools;
                body.tool_choice = "auto";
            }
            
            const response = await fetch("https://generativelanguage.googleapis.com/v1beta/", {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                    'Content-Type': 'application/json',
                    'HTTP-Referer': 'https://augustine.puryear.me',
                    'X-Title': 'Augustine Puryear AI Assistant'
                },
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(`API Error: ${response.statusText} - ${errorData.error.message || 'Unknown error'}`);
            }
            return response.json();
        }
    </script>
</body>
</html>
